<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 75 720 295" width="720" height="295" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="430" fill="#ffffff"/>

  <!-- y axis: 0 at y=340, 20% at y=100 => 12 px per % -->
  <line x1="90" y1="340" x2="690" y2="340" stroke="#333" stroke-width="1.2"/>
  <line x1="90" y1="95" x2="90" y2="340" stroke="#333" stroke-width="1.2"/>
  <text x="80" y="344" font-size="11" fill="#555" text-anchor="end">0</text>
  <line x1="90" y1="280" x2="690" y2="280" stroke="#eee"/>
  <text x="80" y="284" font-size="11" fill="#555" text-anchor="end">5%</text>
  <line x1="90" y1="220" x2="690" y2="220" stroke="#eee"/>
  <text x="80" y="224" font-size="11" fill="#555" text-anchor="end">10%</text>
  <line x1="90" y1="160" x2="690" y2="160" stroke="#eee"/>
  <text x="80" y="164" font-size="11" fill="#555" text-anchor="end">15%</text>
  <line x1="90" y1="100" x2="690" y2="100" stroke="#eee"/>
  <text x="80" y="104" font-size="11" fill="#555" text-anchor="end">20%</text>

  <!-- Panel (i): x 120-370. chance 15.3% => y = 340-183.6 = 156.4 -->
  <text x="245" y="92" font-size="12.5" font-weight="bold" fill="#333" text-anchor="middle">(i) different object</text>
  <line x1="120" y1="156.4" x2="370" y2="156.4" stroke="#b03a3a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="368" y="150" font-size="10" fill="#b03a3a" text-anchor="end">chance 15.3%</text>
  <!-- bars: qwen 17.8 => h=213.6? no: 17.8*12=213.6 exceeds panel; scale is 12px/% so 17.8% => 213.6px, y=126.4 -->
  <rect x="145" y="126.4" width="52" height="213.6" fill="#4d7ba6"/>
  <text x="171" y="120" font-size="10.5" fill="#2f5175" text-anchor="middle">17.8</text>
  <rect x="222" y="156.4" width="52" height="183.6" fill="#7a9cc0"/>
  <text x="248" y="150" font-size="10.5" fill="#456f96" text-anchor="middle">15.3</text>
  <rect x="299" y="228.4" width="52" height="111.6" fill="#b9c9da"/>
  <text x="325" y="222" font-size="10.5" fill="#6b8199" text-anchor="middle">9.3</text>

  <!-- Panel (ii): x 420-670. chance 14.1% => y = 340-169.2 = 170.8 -->
  <text x="545" y="92" font-size="12.5" font-weight="bold" fill="#333" text-anchor="middle">(ii) different object AND receptacle</text>
  <line x1="420" y1="170.8" x2="670" y2="170.8" stroke="#b03a3a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="668" y="164" font-size="10" fill="#b03a3a" text-anchor="end">chance 14.1%</text>
  <rect x="445" y="208" width="52" height="132" fill="#4d7ba6"/>
  <text x="471" y="202" font-size="10.5" fill="#2f5175" text-anchor="middle">11.0</text>
  <rect x="522" y="238" width="52" height="102" fill="#7a9cc0"/>
  <text x="548" y="232" font-size="10.5" fill="#456f96" text-anchor="middle">8.5</text>
  <rect x="599" y="258.4" width="52" height="81.6" fill="#b9c9da"/>
  <text x="625" y="252" font-size="10.5" fill="#6b8199" text-anchor="middle">6.8</text>

  <!-- divider -->
  <line x1="395" y1="95" x2="395" y2="340" stroke="#ddd" stroke-width="1"/>

  <!-- x labels -->
  <text x="171" y="360" font-size="10.5" fill="#333" text-anchor="middle">Qwen3-8B</text>
  <text x="248" y="360" font-size="10.5" fill="#333" text-anchor="middle">Gemini</text>
  <text x="325" y="360" font-size="10.5" fill="#333" text-anchor="middle">MiniLM</text>
  <text x="471" y="360" font-size="10.5" fill="#333" text-anchor="middle">Qwen3-8B</text>
  <text x="548" y="360" font-size="10.5" fill="#333" text-anchor="middle">Gemini</text>
  <text x="625" y="360" font-size="10.5" fill="#333" text-anchor="middle">MiniLM</text>

  <!-- annotation -->
  </svg>
